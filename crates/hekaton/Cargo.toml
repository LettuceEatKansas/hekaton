[package]
name = "hekaton"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hekaton: desktop control for AI agents (daemon, MCP server, CLI)."

[lib]
name = "hekaton_lib"
path = "src/lib.rs"

[[bin]]
name = "hekaton"
path = "src/main.rs"

# The daemon with no console window (windows_subsystem = "windows"), for a scheduled task to start.
[[bin]]
name = "hekatond"
path = "src/bin/hekatond.rs"

[dependencies]
hekaton-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tiny_http = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
hekaton-win = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
hekaton-mac = { workspace = true }

[dev-dependencies]
hekaton-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
