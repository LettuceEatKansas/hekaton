name: ci

on:
  push:
    branches: [main, mac]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, test, lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: parity script tests (mock servers, no daemon)
        run: python -m unittest discover -s tests/parity
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: hekaton-mac Intel target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo clippy -p hekaton-mac --target x86_64-apple-darwin -- -D warnings
      - name: hekaton-mac smoke output
        if: runner.os == 'macOS'
        run: cargo test -p hekaton-mac --test macos_smoke -- --nocapture --test-threads=1
      - name: hekaton-mac end to end (Calculator, TextEdit)
        if: runner.os == 'macOS'
        # Hosted runners do not guarantee a granted, unlocked desktop. This exploratory lane is
        # diagnostic only; see native-acceptance.yml and docs/NATIVE-ACCEPTANCE.md for release checks.
        continue-on-error: true
        timeout-minutes: 8
        run: cargo test -p hekaton-mac --test macos_e2e -- --ignored --nocapture --test-threads=1
