<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Order options</title></head>
<body>
<h1>Order options</h1>
<p><label for="size">Size</label> <select id="size"><option value="">Choose...</option>
<option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></p>
<p><input type="checkbox" id="gift"> <label for="gift">Gift wrap</label></p>
<p><button id="place" type="button">Place order</button></p>
<p id="result" role="status"></p>
<script>
var SALT="s2-copper";
function code(s){var h=7;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%1000003;}return "K"+("000000"+h).slice(-6);}
document.getElementById("place").onclick=function(){
var s=document.getElementById("size").value,g=document.getElementById("gift").checked?"yes":"no";
var r=document.getElementById("result");
if(!s){r.textContent="Choose a size.";return;}
r.textContent="Order placed. Confirmation code: "+code(["opts",s,g].join("|")+"|"+SALT);};
</script>
</body></html>
